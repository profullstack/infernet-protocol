name: Build book (PDF + EPUB)

on:
  push:
    branches: [master]
    paths:
      - "docs/book/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Pandoc + LaTeX + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            pandoc \
            texlive-luatex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            fonts-liberation \
            fonts-noto

      - name: Collect chapters in order
        run: |
          OUT=docs/book/_combined.md
          printf -- "---\ntitle: 'The Infernet Protocol Book'\nsubtitle: 'The complete guide to decentralized GPU inference'\nauthor: 'Infernet Protocol'\ndate: '$(date +%Y)'\nlang: en-US\n---\n\n" > $OUT

          [ -f docs/book/index.md ] && { cat docs/book/index.md >> $OUT; printf '\n\n---\n\n' >> $OUT; }

          for section_dir in $(ls -d docs/book/[0-9]*/ | sort); do
            [ -f "${section_dir}index.md" ] && { cat "${section_dir}index.md" >> $OUT; printf '\n\n---\n\n' >> $OUT; }
            for chapter in $(ls ${section_dir}*.md 2>/dev/null | grep -v index.md | sort); do
              cat "$chapter" >> $OUT
              printf '\n\n---\n\n' >> $OUT
            done
          done

      - name: Build PDF
        run: |
          pandoc docs/book/_combined.md \
            --pdf-engine=lualatex \
            --toc --toc-depth=2 \
            --highlight-style=tango \
            -V geometry:margin=1in \
            -V fontsize=11pt \
            -V colorlinks=true \
            -V linkcolor=blue \
            -V mainfont="Liberation Serif" \
            -V sansfont="Liberation Sans" \
            -V monofont="Noto Sans Mono" \
            -V monofontoptions="Scale=0.82" \
            -H docs/book/preamble.tex \
            --include-before-body=docs/book/cover-page.tex \
            --resource-path=docs/book \
            -o docs/book/infernet-book.pdf

      - name: Build EPUB
        run: |
          pandoc docs/book/_combined.md \
            --toc --toc-depth=2 \
            --highlight-style=tango \
            --epub-cover-image=docs/book/cover.jpg \
            --resource-path=docs/book \
            -o docs/book/infernet-book.epub

      - name: Copy to web public dir
        run: |
          mkdir -p apps/web/public/book
          cp docs/book/infernet-book.pdf  apps/web/public/book/
          cp docs/book/infernet-book.epub apps/web/public/book/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: infernet-book
          path: |
            docs/book/infernet-book.pdf
            docs/book/infernet-book.epub

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            docs/book/infernet-book.pdf \
            docs/book/infernet-book.epub \
            apps/web/public/book/infernet-book.pdf \
            apps/web/public/book/infernet-book.epub || true
          git diff --cached --quiet || \
            git commit -m "ci(book): regenerate PDF + EPUB [skip ci]"
          git push || true
